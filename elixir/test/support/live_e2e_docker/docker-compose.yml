services:
  worker1:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${CYMPHONY_LIVE_DOCKER_WORKER_1_PORT}:22"
    volumes:
      - ${CYMPHONY_LIVE_DOCKER_AUTHORIZED_KEY}:/run/cymphony/ssh/authorized_key.pub:ro
      - ${CYMPHONY_LIVE_DOCKER_AUTH_JSON}:/root/.claude/auth.json:ro

  worker2:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${CYMPHONY_LIVE_DOCKER_WORKER_2_PORT}:22"
    volumes:
      - ${CYMPHONY_LIVE_DOCKER_AUTHORIZED_KEY}:/run/cymphony/ssh/authorized_key.pub:ro
      - ${CYMPHONY_LIVE_DOCKER_AUTH_JSON}:/root/.claude/auth.json:ro
